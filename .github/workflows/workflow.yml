name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A37205: ${{ secrets.A37205 }}
          BE177A: ${{ secrets.BE177A }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A37205', '')
          sec_b = os.environ.get('BE177A', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 996f9fd913e07e3594bfa3824c8eddd49e8133cf6b5126 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- f2875f45406efbe4c29ff83e7707254c -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
